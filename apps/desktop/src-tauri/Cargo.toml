[package]
name = "agora-desktop"
version = "0.1.3"
edition = "2021"
description = "Agora — local AI agent hub (desktop shell)"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
codegen-units = 16
# strip 会把 proc-macro dylib 的 LINKEDIT 破坏（mis-aligned string pool，
# dyld 拒绝加载），在本工具链组合下必须关闭
strip = "none"
